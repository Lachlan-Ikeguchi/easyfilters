[package]
name = "easyfilters"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
v4l2r = "0.0.7"
# Milestone 2 (segmentation): pure-Rust ONNX runtime + OpenCV for frame
# decode/resize/encode. On this nix box the opencv build needs:
#   OPENCV_INCLUDE_PATHS=/usr/include   (headers live in /usr/include/opencv2,
#                                        not the opencv4/ layout)
#   LIBCLANG_PATH=<nix clang-lib>/lib   (bindgen/libclang; e.g.
#                                        /nix/store/...-clang-21.1.8-lib/lib)
#   LD_LIBRARY_PATH=<same>              (so the build script can dlopen it)
# plus the crate's `clang-runtime` feature (bindgen's clang-sys/runtime is
# unified on, so the binding generator must load libclang at runtime).
# With the nix flake (nix develop / nix build) none of these exports are
# needed: flake.nix sets them from nixpkgs' libclang/opencv4/linuxHeaders.
tract-onnx = "0.23"
opencv = { version = "0.102", features = ["clang-runtime"] }
# Milestone 4 (GUI + tray + config).
# iced with the tiny-skia software renderer only (no wgpu: no shaderc/cmake/GPU
# and no extra system libs) plus the image widget for the live preview. The
# wayland/x11 features pull in winit's compositors backends; libxkbcommon and
# libwayland are provided by the nix flake (dlopen'd/linked by winit).
# tray-item with the ksni feature: pure-Rust StatusNotifierItem over D-Bus,
# no gtk3/libappindicator system libraries needed.
# pipewire/tokio stay unused: capture is the v4l2r MMAP path in a std::thread.
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
iced = { version = "0.14.0", default-features = false, features = [
    "tiny-skia",
    "image",
    # smol (not thread-pool): the thread-pool backend has no time::every,
    # which the preview subscription needs. smol is pure Rust.
    "smol",
    "wayland",
    "x11",
    "web-colors",
    "crisp",
    "fira-sans",
] }
tray-item = { version = "0.10.0", default-features = false, features = ["ksni"] }

